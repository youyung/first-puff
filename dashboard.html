<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>第一口之前｜教師後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#F2F7F5;--paper:#fff;--ink:#173038;--muted:#56707A;--line:#D6E5E2;--accent:#0C7A84;--soft:#DCEFEE;--gold:#E9A82A;--warn:#D2523C;--warn-soft:#FBE3DD;--good:#23885A;--good-soft:#DAF1E4;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.in{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
button,select,input{font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{background:var(--paper);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap}
.top h1{font-size:24px;margin-right:auto}
.top a{color:var(--muted);text-decoration:none;font-size:14px}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;min-height:42px}
.btn.g{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.login{max-width:420px;margin:60px auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:12px}
.login h2{font-size:26px}
.login input{padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:17px}
.login label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.err{color:var(--warn);font-weight:700;min-height:1.5em}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-block:20px}
.bar select{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);min-height:42px}
.bar .upd{color:var(--muted);font-size:13px;margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile small{color:var(--muted);font-size:13px;display:block}
.tile b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.3}
.tile b span{font-size:14px;color:var(--muted);font-weight:500}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start}
.panel h2{font-size:18px}
.dist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:8px;align-items:center;font-size:14px}
.drow .tr{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.drow .fl{height:100%;border-radius:7px;background:var(--accent)}
.drow .fl.bad{background:var(--warn)}
.drow b{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{margin-block:16px 40px;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:900px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:700;position:sticky;top:0;cursor:pointer;user-select:none}
td.n{font-variant-numeric:tabular-nums}
tr:hover td{background:#F7FBFA}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:700}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:#EEF2F3;color:var(--muted)}
.pill.bad{background:var(--warn-soft);color:var(--warn)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.setup{max-width:640px;margin:60px auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:10px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr}}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>教師後台</h1>
  <a href="index.html">課程首頁</a>
  <button class="btn g" id="logout" type="button" hidden>登出</button>
</div></header>

<main class="in" id="app"></main>

<script src="config.js"></script>
<script>
(function(){
const CFG=window.GAME_CONFIG||{};
const app=document.getElementById("app");
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let KEY=store.get("fp_key")||sessionStorage.getItem("fp_key")||"";
let DATA=[],F={cls:"",st:"",day:"all"},sortK="cls",sortAsc=true,timer=null;

if(!CFG.API_URL){
  app.innerHTML=`<section class="setup"><h2>還沒有設定後台</h2><p>請先依照 README.md 的「設定後台」步驟，建立 Google 試算表與 Apps Script，再把網址貼到 <b>config.js</b> 的 <b>API_URL</b>。</p></section>`;
  return;
}
document.getElementById("logout").onclick=()=>{store.del("fp_key");try{sessionStorage.removeItem("fp_key")}catch(e){}KEY="";if(timer)clearInterval(timer);login()};

function login(msg){
  document.getElementById("logout").hidden=true;
  app.innerHTML=`<form class="login" id="lf"><h2>登入</h2><p style="color:var(--muted)">輸入你在 Apps Script 設定的教師密碼。</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="教師密碼" required>
    <label><input type="checkbox" id="rem"> 在這台裝置記住密碼</label>
    <p class="err" id="err">${esc(msg||"")}</p><button class="btn" type="submit">查看紀錄</button></form>`;
  document.getElementById("lf").onsubmit=e=>{e.preventDefault();KEY=document.getElementById("pw").value;
    if(document.getElementById("rem").checked)store.set("fp_key",KEY);else{try{sessionStorage.setItem("fp_key",KEY)}catch(e){}}
    load(true)};
}

async function load(first){
  if(first)app.innerHTML=`<p class="empty">讀取中…</p>`;
  try{
    const r=await fetch(CFG.API_URL+"?key="+encodeURIComponent(KEY)+"&t="+Date.now());
    const j=await r.json();
    if(!j.ok){store.del("fp_key");return login("密碼不正確，請再試一次。")}
    DATA=merge(j.rows);document.getElementById("logout").hidden=false;
    if(first||!document.getElementById("tbody"))shell();
    render();
  }catch(e){if(first)login("連不到後台。請確認 config.js 的網址，以及 Apps Script 已部署為「所有人」可存取。")}
}

function merge(rows){
  const m=new Map();
  rows.forEach(r=>{const k=r.sid||Math.random();const o=m.get(k)||{sid:k};
    if(r.type==="開始"){o.start=r.time;o.cls=r.cls;o.seat=r.seat;o.nick=r.nick}
    else{Object.assign(o,r);o.done=true;o.end=r.time}
    m.set(k,o)});
  return [...m.values()];
}
function today(t){if(!t)return false;const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()}
function filtered(){return DATA.filter(r=>(!F.cls||String(r.cls)===F.cls)&&(!F.st||(F.st==="done"?r.done:!r.done))&&(F.day==="all"||today(r.start||r.end)))}

function shell(){
  const classes=[...new Set(DATA.map(r=>String(r.cls||"")).filter(Boolean))].sort();
  app.innerHTML=`<div class="bar">
     <select id="fc" aria-label="班級"><option value="">全部班級</option>${classes.map(c=>`<option ${F.cls===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
     <select id="fs" aria-label="狀態"><option value="">全部狀態</option><option value="done">已完成</option><option value="ing">未完成</option></select>
     <select id="fd" aria-label="日期"><option value="all">全部日期</option><option value="today">只看今天</option></select>
     <button class="btn g" id="rf" type="button">重新整理</button>
     <button class="btn g" id="csv" type="button">匯出 CSV</button>
     <span class="upd" id="upd"></span></div>
   <div class="tiles" id="tiles"></div>
   <div class="grid3" id="dists"></div>
   <div class="tablewrap"><table><thead><tr>${COLS.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("")}</tr></thead><tbody id="tbody"></tbody></table></div>`;
  document.getElementById("fs").value=F.st;document.getElementById("fd").value=F.day;
  document.getElementById("fc").onchange=e=>{F.cls=e.target.value;render()};
  document.getElementById("fs").onchange=e=>{F.st=e.target.value;render()};
  document.getElementById("fd").onchange=e=>{F.day=e.target.value;render()};
  document.getElementById("rf").onclick=()=>load(false);
  document.getElementById("csv").onclick=csv;
  app.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortAsc=sortK===k?!sortAsc:true;sortK=k;render()});
  if(timer)clearInterval(timer);timer=setInterval(()=>load(false),30000);
}

const COLS=[["cls","班級"],["seat","座號"],["nick","暱稱"],["status","狀態"],["ending","結局"],["health","健康"],["friend","友情"],["cards","知識卡"],["quiz","小考"],["dorm","戶外教育那晚"],["cram","補習班檳榔"],["shop","陌生私訊"],["feedAct","廣告處理"],["minutes","分鐘"],["start","開始時間"]];
function cell(r,k){
  if(k==="status")return r.done?`<span class="pill ok">完成</span>`:`<span class="pill no">進行中／未完成</span>`;
  if(k==="dorm"&&r.dorm)return /一口/.test(r.dorm)?`<span class="pill bad">${esc(r.dorm)}</span>`:esc(r.dorm);
  if(k==="cram"&&r.cram==="吃了一顆")return `<span class="pill bad">吃了一顆</span>`;
  if(k==="quiz"&&r.quiz!==undefined&&r.quiz!=="")return esc(r.quiz)+" / 4";
  if(k==="cards"&&r.cards!==undefined&&r.cards!=="")return esc(r.cards)+" / 12";
  if(k==="start"){const t=r.start||r.end;if(!t)return "";const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
  return esc(r[k]);
}
function sortVal(r,k){const v=k==="status"?(r.done?1:0):k==="start"?(r.start||r.end||""):r[k];const n=Number(v);return v!==""&&v!=null&&!isNaN(n)?n:String(v==null?"":v)}

function render(){
  const fc=document.getElementById("fc");
  if(fc){const classes=[...new Set(DATA.map(r=>String(r.cls||"")).filter(Boolean))].sort();
    fc.innerHTML=`<option value="">全部班級</option>`+classes.map(c=>`<option ${F.cls===c?"selected":""}>${esc(c)}</option>`).join("")}
  const rows=filtered();
  rows.sort((a,b)=>{let x=sortVal(a,sortK),y=sortVal(b,sortK);if(sortK==="cls"&&x===y){x=Number(a.seat)||0;y=Number(b.seat)||0}return (x>y?1:x<y?-1:0)*(sortAsc?1:-1)});
  const done=rows.filter(r=>r.done),n=done.length;
  const avg=k=>n?(done.reduce((s,r)=>s+(Number(r[k])||0),0)/n):0;
  const firstRefuse=done.filter(r=>r.dorm&&!/一口/.test(r.dorm)).length;
  const tried=done.filter(r=>r.tried==="是"||r.tried===true).length;
  document.getElementById("tiles").innerHTML=[
    ["開始人數",rows.length,"人"],["完成人數",n,"人"],["平均知識卡",avg("cards").toFixed(1),"/ 12"],
    ["小考平均",avg("quiz").toFixed(1),"/ 4"],["那晚第一次就拒絕",n?Math.round(firstRefuse/n*100):0,"%"],["曾選「一口就好」",tried,"人"]
  ].map(([l,v,u])=>`<div class="tile"><small>${l}</small><b>${v} <span>${u}</span></b></div>`).join("");
  const dist=(title,k,badRe)=>{const c={};done.forEach(r=>{const v=r[k]||"（無）";c[v]=(c[v]||0)+1});const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);
    return `<div class="panel"><h2>${title}</h2><div class="dist">${e.length?e.map(([v,x])=>`<div class="drow"><span>${esc(v)}</span><div class="tr"><div class="fl ${badRe&&badRe.test(v)?"bad":""}" style="width:${x/n*100}%"></div></div><b>${x} 人</b></div>`).join(""):`<p style="color:var(--muted)">還沒有完成的紀錄</p>`}</div></div>`};
  document.getElementById("dists").innerHTML=dist("戶外教育那晚的選擇","dorm",/一口/)+dist("補習班學長遞檳榔","cram",/吃了/)+dist("看到電子煙廣告","feedAct",/按讚/);
  document.getElementById("tbody").innerHTML=rows.length?rows.map(r=>`<tr>${COLS.map(c=>`<td class="${["seat","health","friend","minutes"].includes(c[0])?"n":""}">${cell(r,c[0])}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${COLS.length}" class="empty">目前沒有符合條件的紀錄</td></tr>`;
  const d=new Date();document.getElementById("upd").textContent=`更新於 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}，每 30 秒自動更新`;
}

function csv(){
  const rows=filtered();
  const K=[["cls","班級"],["seat","座號"],["nick","暱稱"],["done","狀態"],["ending","結局"],["health","健康"],["friend","友情"],["cards","知識卡"],["quiz","小考答對"],["penGuess","照片猜測"],["thought","第1天想法"],["zheInvite","回覆阿哲邀約"],["feedAct","廣告處理"],["searchWrong","搜尋選錯次數"],["shop","陌生私訊"],["cram","補習班檳榔"],["gpa","回覆阿公"],["dorm","戶外教育那晚"],["tried","曾選一口就好"],["helpedZhe","陪阿哲找大人"],["minutes","遊玩分鐘"],["start","開始時間"]];
  const q=v=>{let s=String(v==null?"":v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const lines=[K.map(k=>q(k[1])).join(",")].concat(rows.map(r=>K.map(([k])=>q(k==="done"?(r.done?"完成":"未完成"):r[k])).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`第一口之前紀錄_${F.cls||"全部班級"}.csv`;document.body.appendChild(a);a.click();a.remove();
}

if(KEY)load(true);else login();
})();
</script>
</body>
</html>
